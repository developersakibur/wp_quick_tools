<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="header">
    <h1>WP Quick Tools</h1>
  </div>

  <div id="content" class="container">
    <!-- Tab Position Settings -->
    <div class="section">
      <div class="position-toggle">
        <button class="position-btn" id="beforeBtn">← Before</button>
        <button class="position-btn active" id="afterBtn">After →</button>
      </div>
    </div>

    <!-- WordPress Links -->
    <div id="wpSection" class="section">
      <div class="link-grid">
        <div class="link-item" data-url="/wp-admin/">
          <div class="link-label">
            <span>WP-Admin</span>
          </div>
          <span class="link-arrow">→</span>
        </div>
        <div class="link-item" data-url="/wp-admin/admin.php?page=ai1wm_export">
          <div class="link-label">
            <span>All In One</span>
          </div>
          <span class="link-arrow">→</span>
        </div>
      </div>
    </div>

    <!-- Website Access -->
    <div class="section">
      <div class="tool-grid">
        <button class="btn" id="viewWebsiteBtn">
          <span>Normal</span>
        </button>
        <button class="btn" id="websiteIncognitoBtn">
          <span>Incognito</span>
        </button>
      </div>
    </div>

    <!-- No Cache Tools -->
    <div class="section">
      <div class="tool-grid">
        <button class="btn" id="normalVisitBtn">
          <span>NC Normal</span>
        </button>
        <button class="btn" id="incognitoBtn">
          <span>NC Incognito</span>
        </button>
      </div>
    </div>

    <!-- Analysis Tools -->
    <div class="section">
      <div class="tool-grid">
        <button class="btn" id="pageSpeedBtn">
          <span>Speed</span>
        </button>
        <button class="btn" id="dnsCheckerBtn">
          <span>DNS</span>
        </button>
      </div>
    </div>

    <!-- Action Tools -->
    <div class="section">
      <button class="btn btn-primary" id="copyUrlBtn">
        <span>Copy Current URL</span>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
